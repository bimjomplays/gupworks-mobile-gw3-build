# XcodeGen spec for the GupWorks 3 iPhone app. The .xcodeproj and Sources/Info.plist are generated on the macOS
# runner (`xcodegen generate`) and never committed. This folder is published to the public build repo: nothing
# personal or secret goes here (signing team, keys and the like come from the runner's secrets).
name: GupWorks3
options:
  bundleIdPrefix: app.gupworks3
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.11"
    CURRENT_PROJECT_VERSION: "1"
# Hammer: real touches (taps, drags, long presses, pinches) inside the unit-test process, for the screen tests
# (Tests/ScreenDriver.swift); XCTest's own event synthesizer only works from a UI-test bundle
packages:
  Hammer:
    url: https://github.com/lyft/Hammer
    exactVersion: 2.1.1
targets:
  GupWorks3:
    type: application
    platform: iOS
    sources:
      - Sources
      # the plain logic (models, API, routes, pairing, stores): a Swift package that also builds and tests on Linux;
      # the app compiles its files directly (mobile/GupKit/Package.swift says why)
      - ../GupKit/Sources/GupKit
      - Resources
      # recorded gw3-phone answers (invented text) for the demo mode and the screenshot tests
      - path: ../fixtures
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GupWorks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        # upright only, except the video player (AppDelegate's mask in VideoPlayer.swift)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
                                           UIInterfaceOrientationLandscapeRight]
        # picture in picture keeps a video playing outside the app
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        # the pairing QR holds a gupworks3://pair link, so the iPhone camera app can open it here too
        CFBundleURLTypes:
          - CFBundleURLName: app.gupworks3.phone.pair
            CFBundleURLSchemes: [gupworks3]
        NSCameraUsageDescription: >-
          GupWorks uses the camera to scan the pairing code your PC shows and to take photos you send to a chat on your
          PC. Nothing else is recorded or sent anywhere.
        NSMicrophoneUsageDescription: >-
          GupWorks records your voice only while you hold or tap the mic in a chat, so your PC can turn it into text
          for Claude (deleted once it's text), or while you record a voice memo, which is sent to the chat as an audio
          file.
        # the PC's tailnet address, when its Tailscale name can't be looked up (Routes.swift): plain HTTP inside
        # Tailscale's encrypted tunnel, and only to Tailscale's own ranges
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: >-
          GupWorks reaches your PC through Tailscale, by its Tailscale address when its name can't be looked up.
        NSPhotoLibraryAddUsageDescription: >-
          GupWorks saves a picture or video to your photos only when you choose Save in the share sheet or Save to
          Photos on a file your PC sent.
        NSSpeechRecognitionUsageDescription: >-
          When your PC can't be reached, GupWorks turns your recording into text on this iPhone instead. Nothing is
          sent anywhere else.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gupworks3.phone
        PRODUCT_NAME: GupWorks3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        # unsigned by default (the ipa and shots jobs); the testflight job turns signing on with its own settings
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  GupWorks3Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # GupKit's tests run here too, against the app's copy of the same files
      - ../GupKit/Tests/GupKitTests
    dependencies:
      - target: GupWorks3
      - package: Hammer
        product: Hammer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.gupworks3.phone.tests
        CODE_SIGNING_ALLOWED: "NO"
  GupWorks3UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GupWorks3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.gupworks3.phone.uitests
        TEST_TARGET_NAME: GupWorks3
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  GupWorks3:
    build:
      targets:
        GupWorks3: all
        GupWorks3Tests: [test]
        GupWorks3UITests: [test]
    test:
      config: Debug
      targets:
        - GupWorks3Tests
        - GupWorks3UITests
    archive:
      config: Release
